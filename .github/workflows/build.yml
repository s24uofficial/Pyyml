name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Unzip and Flatten Structure
      run: |
        if [ -f "PyMLRunner.zip" ]; then
          unzip -q -o PyMLRunner.zip -d extracted_temp
          if [ -d "extracted_temp/PyMLRunner" ]; then
            cp -r extracted_temp/PyMLRunner/* .
          else
            cp -r extracted_temp/* .
          fi
          rm -rf extracted_temp
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
        fi

    - name: Build with Gradle
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug --stacktrace --no-daemon
        else
          gradle assembleDebug --stacktrace --no-daemon
        fi

    - name: Upload APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: PyMLRunner-Debug-APK
        path: "**/build/outputs/apk/debug/*.apk"
        if-no-files-found: ignore
