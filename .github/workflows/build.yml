name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unzip If Zip Exists
      run: |
        if [ -f "PyMLRunner.zip" ]; then
          unzip -o PyMLRunner.zip
          # Agar zip ke andar PyMLRunner naam ka subfolder nikla toh use bahar le aayenge
          if [ -d "PyMLRunner" ]; then
            cp -r PyMLRunner/* . || true
          fi
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Build Debug APK
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug --stacktrace
        else
          gradle assembleDebug --stacktrace
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: PyMLRunner-Debug-APK
        path: "**/build/outputs/apk/debug/*.apk"
